kind = "web"
previewPath = "/"
title = "Prarthana U — Portfolio"
description = "A personal engineering portfolio for Prarthana U, presenting her experience in agent evaluation infrastructure, ML systems, and software projects."
version = "1.0.0"
id = "artifacts/prarthana-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21364

[services.development]
run = "pnpm --filter @workspace/prarthana-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prarthana-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/prarthana-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21364"
BASE_PATH = "/"
